#!/usr/sbin/nft -f
# ubu-fw · firewall central de Gestión Norte (laboratorio, Zaragoza)
# Estado: borrador, pendiente de verificar. Política por defecto: denegar y registrar.
# Interfaces (nombres fijados por MAC en netplan): wan, v10, v20, v30, v40

flush ruleset

table inet filtro {

    # Controladores de dominio (VLAN 20)
    set dcs {
        type ipv4_addr
        elements = { 10.1.20.10, 10.1.20.11 }
    }

    # Tráfico dirigido al propio firewall
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif "lo" accept

        # El firewall es cliente DHCP de la WAN (NAT de VMware)
        iifname "wan" udp sport 67 udp dport 68 accept

        # Ping al firewall solo desde las VLAN internas
        iifname { "v10", "v20", "v30", "v40" } icmp type echo-request limit rate 10/second accept

        # DHCP (Kea) solo en las VLAN de usuarios
        iifname { "v30", "v40" } udp sport 68 udp dport 67 accept

        # DNS (Unbound) solo desde las VLAN internas
        iifname { "v10", "v20", "v30", "v40" } meta l4proto { tcp, udp } th dport 53 accept

        # SSH solo desde la VLAN de gestión
        iifname "v10" tcp dport 22 accept

        counter comment "descartado por la política por defecto"
        limit rate 6/minute burst 10 packets log prefix "fw-entrada-denegado: "
    }

    # Tráfico que atraviesa el firewall entre VLAN e Internet
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        # Usuarios (Laboral, Fiscal) -> web
        iifname { "v30", "v40" } oifname "wan" tcp dport { 80, 443 } accept
        iifname { "v30", "v40" } oifname "wan" udp dport 443 accept

        # Usuarios -> solo los controladores de dominio (Active Directory)
        iifname { "v30", "v40" } oifname "v20" ip daddr @dcs tcp dport { 53, 88, 135, 389, 445, 464, 636, 3268, 3269, 49152-65535 } accept
        iifname { "v30", "v40" } oifname "v20" ip daddr @dcs udp dport { 53, 88, 123, 389, 464 } accept

        # Gestión -> servidores: SSH, escritorio remoto y WinRM por HTTPS
        iifname "v10" oifname "v20" tcp dport { 22, 3389, 5986 } accept
        iifname "v10" oifname "v20" icmp type echo-request accept

        # Gestión y servidores -> web (actualizaciones)
        iifname { "v10", "v20" } oifname "wan" tcp dport { 80, 443 } accept

        # Pendiente: agentes (Wazuh 1514/1515, Zabbix 10050) y la aplicación (Caddy 443)

        counter comment "descartado por la política por defecto"
        limit rate 6/minute burst 10 packets log prefix "fw-reenvio-denegado: "
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "wan" masquerade
    }
}
