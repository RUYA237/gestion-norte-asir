# ubu-fw · Unbound (DNS) de Gestión Norte. Va en /etc/unbound/unbound.conf.d/gn.conf
# Estado: borrador, pendiente de verificar.
server:
    interface: 10.1.10.1
    interface: 10.1.20.1
    interface: 10.1.30.1
    interface: 10.1.40.1
    ip-freebind: yes
    port: 53
    do-ip6: no

    # Solo responde a las VLAN internas
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.1.10.0/24 allow
    access-control: 10.1.20.0/24 allow
    access-control: 10.1.30.0/24 allow
    access-control: 10.1.40.0/24 allow

    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    unwanted-reply-threshold: 10000

    # Protección contra respuestas externas con IP privadas (excepto el dominio de la empresa)
    private-address: 10.0.0.0/8
    private-domain: "ad.gestionnorte.es"

# La zona de Active Directory la resuelven los controladores
forward-zone:
    name: "ad.gestionnorte.es"
    forward-addr: 10.1.20.10
    forward-addr: 10.1.20.11

# El resto de Internet
forward-zone:
    name: "."
    forward-addr: 9.9.9.9
    forward-addr: 1.1.1.1
