# /etc/wireguard/wg-ter.conf en ubu-fw (túnel de Teruel). Permisos 600, root.
[Interface]
Address = 10.255.13.1/30
ListenPort = 51821
PrivateKey = (oculta: la misma de ubu-fw, /etc/wireguard/fw.key)

[Peer]
PublicKey = (clave pública de rt-ter, /etc/wireguard/ter.pub en rt-ter)
AllowedIPs = 10.255.13.2/32, 10.3.0.0/16
