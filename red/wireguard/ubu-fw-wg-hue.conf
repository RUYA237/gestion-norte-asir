# /etc/wireguard/wg-hue.conf en ubu-fw (túnel de Huesca). Permisos 600, root.
[Interface]
Address = 10.255.12.1/30
ListenPort = 51820
PrivateKey = (oculta: la genera ubu-fw en /etc/wireguard/fw.key)

[Peer]
PublicKey = (clave pública de rt-hue, /etc/wireguard/hue.pub en rt-hue)
AllowedIPs = 10.255.12.2/32, 10.2.0.0/16
