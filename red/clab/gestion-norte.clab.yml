name: gestion-norte

topology:
  defaults:
    kind: linux
    image: gn-red:1.0
    cap-add: [NET_ADMIN]
    binds: [nodos:/config:ro]

  nodes:
    inet:
      sysctls: {net.ipv4.ip_forward: 1}
      exec: [bash /config/inet.sh]
    ubu-fw:
      sysctls: {net.ipv4.ip_forward: 1}
      exec: [bash /config/ubu-fw.sh]
    zgz-n1:
      exec: [bash /config/sw.sh zgz-n1]
    zgz-n2:
      exec: [bash /config/sw.sh zgz-n2]
    zgz-a1:
      exec: [bash /config/sw.sh zgz-a1]
    zgz-a2:
      exec: [bash /config/sw.sh zgz-a2]
    zgz-a3:
      exec: [bash /config/sw.sh zgz-a3]
    srv-dc1:
      exec: [bash /config/host.sh 10.1.20.10/24 10.1.20.1 445]
    pc-it:
      exec: [bash /config/host.sh 10.1.10.10/24 10.1.10.1]
    pc-lab-zgz:
      exec: [bash /config/host.sh 10.1.30.50/24 10.1.30.1]
    pc-fis-zgz:
      exec: [bash /config/host.sh 10.1.40.50/24 10.1.40.1]
    pc-adm-zgz:
      exec: [bash /config/host.sh 10.1.50.50/24 10.1.50.1]
    pc-atn-zgz:
      exec: [bash /config/host.sh 10.1.60.50/24 10.1.60.1]
    prn-zgz:
      exec: [bash /config/host.sh 10.1.70.20/24 10.1.70.1]
    pc-inv-zgz:
      exec: [bash /config/host.sh 10.1.80.50/24 10.1.80.1]
    rt-hue:
      sysctls: {net.ipv4.ip_forward: 1}
      exec: [bash /config/rt-sede.sh 2]
    sw-hue1:
      exec: [bash /config/sw.sh sw-hue1]
    sw-hue2:
      exec: [bash /config/sw.sh sw-hue2]
    pc-lab-hue:
      exec: [bash /config/host.sh 10.2.30.50/24 10.2.30.1]
    pc-fis-hue:
      exec: [bash /config/host.sh 10.2.40.50/24 10.2.40.1]
    pc-inv-hue:
      exec: [bash /config/host.sh 10.2.80.50/24 10.2.80.1]
    rt-ter:
      sysctls: {net.ipv4.ip_forward: 1}
      exec: [bash /config/rt-sede.sh 3]
    sw-ter1:
      exec: [bash /config/sw.sh sw-ter1]
    sw-ter2:
      exec: [bash /config/sw.sh sw-ter2]
    pc-fis-ter:
      exec: [bash /config/host.sh 10.3.40.50/24 10.3.40.1]
    pc-inv-ter:
      exec: [bash /config/host.sh 10.3.80.50/24 10.3.80.1]

  links:
    - endpoints: ["inet:eth1", "ubu-fw:wan"]
    - endpoints: ["ubu-fw:eth1", "zgz-n1:eth1"]
    - endpoints: ["zgz-n1:eth2", "zgz-n2:eth1"]
    - endpoints: ["zgz-n1:eth3", "zgz-a1:eth1"]
    - endpoints: ["zgz-n2:eth2", "zgz-a1:eth2"]
    - endpoints: ["zgz-n1:eth4", "zgz-a2:eth1"]
    - endpoints: ["zgz-n2:eth3", "zgz-a2:eth2"]
    - endpoints: ["zgz-n1:eth5", "zgz-a3:eth1"]
    - endpoints: ["zgz-n2:eth4", "zgz-a3:eth2"]
    - endpoints: ["zgz-n1:eth6", "srv-dc1:eth1"]
    - endpoints: ["zgz-a1:eth3", "pc-it:eth1"]
    - endpoints: ["zgz-a1:eth4", "pc-lab-zgz:eth1"]
    - endpoints: ["zgz-a2:eth3", "pc-fis-zgz:eth1"]
    - endpoints: ["zgz-a2:eth4", "pc-adm-zgz:eth1"]
    - endpoints: ["zgz-a3:eth3", "pc-atn-zgz:eth1"]
    - endpoints: ["zgz-a3:eth4", "prn-zgz:eth1"]
    - endpoints: ["zgz-a3:eth5", "pc-inv-zgz:eth1"]
    - endpoints: ["ubu-fw:eth2", "rt-hue:eth2"]
    - endpoints: ["rt-hue:eth1", "sw-hue1:eth1"]
    - endpoints: ["sw-hue1:eth2", "sw-hue2:eth1"]
    - endpoints: ["sw-hue1:eth3", "pc-lab-hue:eth1"]
    - endpoints: ["sw-hue1:eth4", "pc-fis-hue:eth1"]
    - endpoints: ["sw-hue2:eth2", "pc-inv-hue:eth1"]
    - endpoints: ["ubu-fw:eth3", "rt-ter:eth2"]
    - endpoints: ["rt-ter:eth1", "sw-ter1:eth1"]
    - endpoints: ["sw-ter1:eth2", "sw-ter2:eth1"]
    - endpoints: ["sw-ter1:eth3", "pc-fis-ter:eth1"]
    - endpoints: ["sw-ter2:eth2", "pc-inv-ter:eth1"]
