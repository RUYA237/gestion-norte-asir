! ubu-fw (maqueta): direcciones, rutas estaticas y OSPF
frr defaults traditional
hostname ubu-fw
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface troncal
 description Troncal 802.1Q hacia sw-zgz-core
exit
interface v10
 description VLAN 10 Gestion
 ip address 10.1.10.1/24
exit
interface v20
 description VLAN 20 Servidores
 ip address 10.1.20.1/24
exit
interface v30
 description VLAN 30 Laboral
 ip address 10.1.30.1/24
exit
interface v40
 description VLAN 40 Fiscal
 ip address 10.1.40.1/24
exit
interface wan
 description Fibra de Zaragoza (linea principal)
 ip address 203.0.113.2/30
exit
interface wan4g
 description Linea 4G/5G de Zaragoza (respaldo)
 ip address 198.51.100.2/30
exit
!
! Tuneles: coste 10 por la fibra y 100 por el 4G. Saludo cada 2 s y vecino caido a
! los 8 s (por defecto 10 y 40): el cambio de linea tarda segundos, no un minuto.
interface wg-hue-f
 description Tunel a Huesca por la fibra
 ip address 10.0.0.1/30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
interface wg-hue-m
 description Tunel a Huesca por el 4G
 ip address 10.0.0.5/30
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
interface wg-ter-f
 description Tunel a Teruel por la fibra
 ip address 10.0.0.9/30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
interface wg-ter-m
 description Tunel a Teruel por el 4G
 ip address 10.0.0.13/30
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
!
! Salida a Internet: la fibra y, si cae, el 4G (distancia 10, ruta flotante)
ip route 0.0.0.0/0 203.0.113.1
ip route 0.0.0.0/0 198.51.100.1 10
! Tablas de los tuneles: los marcados 0x3 salen por la fibra y los 0x4 por el 4G
ip route 0.0.0.0/0 203.0.113.1 table 3
ip route 0.0.0.0/0 198.51.100.1 table 4
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface default
 network 10.0.0.0/24 area 0
 network 10.1.0.0/16 area 0
 default-information originate
exit
!
line vty
