! rt-ter (maqueta): direcciones, rutas estaticas y OSPF de la sede
frr defaults traditional
hostname rt-ter
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface troncal
 description Troncal 802.1Q hacia sw-ter
exit
interface v10
 description VLAN 10 Gestion de los equipos de red
 ip address 10.3.10.1/24
exit
interface v30
 description VLAN 30 Laboral
 ip address 10.3.30.1/24
exit
interface v40
 description VLAN 40 Fiscal
 ip address 10.3.40.1/24
exit
interface v80
 description VLAN 80 Invitados (no se anuncia por OSPF)
 ip address 10.3.80.1/24
exit
interface wan
 description Fibra de la sede
 ip address 203.0.113.10/30
exit
interface wg-zgz-f
 description Tunel a ubu-fw por su fibra
 ip address 10.0.0.10/30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
interface wg-zgz-m
 description Tunel a ubu-fw por su 4G
 ip address 10.0.0.14/30
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 no ip ospf passive
exit
!
! Solo se llega por la fibra local a los dos extremos de ubu-fw (para los tuneles).
! La ruta por defecto de la empresa llega por OSPF: todo pasa por ubu-fw.
ip route 203.0.113.2/32 203.0.113.9
ip route 198.51.100.2/32 203.0.113.9
! Invitados: tabla 80, salida directa por la fibra local
ip route 0.0.0.0/0 203.0.113.9 table 80
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface default
 network 10.0.0.0/24 area 0
 network 10.3.10.0/24 area 0
 network 10.3.30.0/24 area 0
 network 10.3.40.0/24 area 0
exit
!
line vty
